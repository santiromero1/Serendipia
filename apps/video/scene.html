<!doctype html>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #0d0e10; }
  canvas { display: block; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * Video de presentación de Serendipia. Todo el cuadro es función del tiempo: render(t) dibuja
 * el instante t (segundos), así se puede exportar cuadro por cuadro. Los cortes caen en compases.
 */
const DATA = window.DATA // { bpm, tracks:[{x,y,cluster}], clusters:[{x,y,label,n}], rows:[[{title,artist,key}]], route:[idx], focus: idx, near:[idx] }
const c = document.getElementById('c'), g = c.getContext('2d')
const W = 1920, H = 1080
const BEAT = 60 / DATA.bpm, BAR = BEAT * 4
const BG = '#0d0e10', FG = '#f4f5f7', SOFT = '#b9bcc4', FAINT = '#7d818b', LINE = '#2a2c31', SIGNAL = '#b9dcec', WARN = '#e2b46a'
const T_DROP = 8 * BAR, T_SETS = 16 * BAR, T_ROUTE = 24 * BAR, T_END = 28 * BAR

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const ease = (k) => 1 - Math.pow(1 - clamp(k), 4)
const inOut = (k) => { k = clamp(k); return k < 0.5 ? 8 * k * k * k * k : 1 - Math.pow(-2 * k + 2, 4) / 2 }
const span = (t, a, b) => clamp((t - a) / (b - a))
const hash = (i, s = 1) => { const x = Math.sin(i * 127.1 * s + 311.7) * 43758.5453; return x - Math.floor(x) }
/** Audio del tema, analizado cuadro por cuadro: todo lo que pulsa en pantalla sale de acá. */
const AU = DATA.audio
const au = (t) => {
  const f = clamp(t * AU.fps, 0, AU.bass.length - 1), i = Math.floor(f), j = Math.min(AU.bass.length - 1, i + 1), k = f - i
  const mix = (a) => a[i] + (a[j] - a[i]) * k
  return { bass: mix(AU.bass), mid: mix(AU.mid), high: mix(AU.high), spec: AU.spec[i] }
}
/** Golpe del bombo real del tema, de 0 a 1. */
const kick = (t) => au(t).bass

/** Espectro en anillo alrededor de un centro: cada barra es una banda de frecuencia. */
function ring(t, cx, cy, r, alpha, len = 46) {
  const { spec } = au(t), n = spec.length * 2
  g.save(); g.strokeStyle = FG; g.lineWidth = 2.2; g.lineCap = 'round'
  for (let i = 0; i < n; i++) {
    // espejado: graves arriba y abajo, agudos a los costados
    const v = spec[i < spec.length ? i : n - 1 - i], an = (i / n) * 6.2832 - 1.5708
    g.globalAlpha = alpha * (0.18 + 0.82 * v)
    g.beginPath(); g.moveTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r); g.lineTo(cx + Math.cos(an) * (r + 3 + v * len), cy + Math.sin(an) * (r + 3 + v * len)); g.stroke()
  }
  g.restore()
}
/** Espectro en línea: barras finas, para las escenas con interfaz. */
function bars(t, x, y, w, h, alpha) {
  const { spec } = au(t), step = w / spec.length
  g.save(); g.fillStyle = FG
  spec.forEach((v, i) => { g.globalAlpha = alpha * (0.25 + 0.75 * v); g.fillRect(x + i * step, y - v * h, step * 0.5, Math.max(2, v * h)) })
  g.restore()
}
const font = (px, w = 500, mono = false) => `${w} ${px}px ${mono ? '"Geist Mono"' : 'Geist'}, system-ui, sans-serif`

const N = DATA.tracks.length
const SIDE = 900
const gal = DATA.tracks.map((p) => [W / 2 + (p.x - 0.5) * SIDE, H / 2 + (p.y - 0.5) * SIDE])
const hubs = DATA.clusters.map((h) => [W / 2 + (h.x - 0.5) * SIDE, H / 2 + (h.y - 0.5) * SIDE])
const rnd = DATA.tracks.map((_, i) => [hash(i) * W, hash(i, 2.3) * H])

/** Texto que entra subiendo y se va desvaneciendo. */
function caption(t, a, b, text, { y = H / 2, px = 76, color = FG, align = 'center', x = W / 2, weight = 500 } = {}) {
  if (t < a || t > b) return
  const kin = ease(span(t, a, a + 0.5)), kout = span(t, b - 0.35, b)
  g.save()
  g.globalAlpha = kin * (1 - kout)
  g.font = font(px, weight)
  g.textAlign = align
  g.fillStyle = color
  g.fillText(text, x, y + (1 - kin) * 18)
  g.restore()
}

function drawGalaxy(t, { alpha = 1, form = 1, cam = null, focus = 0, route = 0 } = {}) {
  g.save()
  if (cam) { g.translate(W / 2, H / 2); g.scale(cam.s, cam.s); g.translate(-cam.x, -cam.y) }
  const k = kick(t), a = au(t)
  const pos = (i) => {
    const drift = [Math.sin(t * 0.25 + i) * 14, Math.cos(t * 0.21 + i * 1.7) * 14]
    const f = ease(form - hash(i, 5.1) * 0.35 * (1 - form))
    return [rnd[i][0] + drift[0] * (1 - f) + (gal[i][0] - rnd[i][0]) * f, rnd[i][1] + drift[1] * (1 - f) + (gal[i][1] - rnd[i][1]) * f]
  }
  // rayos de cada tema al centro de su grupo
  if (form > 0.7) {
    g.strokeStyle = FG; g.lineWidth = 0.7; g.globalAlpha = alpha * (0.05 + 0.1 * k) * span(form, 0.7, 1) * (focus ? 0.5 : 1)
    g.beginPath()
    DATA.tracks.forEach((p, i) => { if (p.cluster == null) return; const [x, y] = pos(i); g.moveTo(x, y); g.lineTo(...hubs[p.cluster]) })
    g.stroke()
  }
  const nearSet = new Set(DATA.near), routeSet = new Set(DATA.route)
  DATA.tracks.forEach((p, i) => {
    const [x, y] = pos(i)
    const hot = (focus && (i === DATA.focus || nearSet.has(i))) || (route && routeSet.has(i))
    // cada punto titila con los agudos, a su propio ritmo; el conjunto respira con los medios
    const tw = a.high * (0.4 + 0.6 * hash(i, 3.7 + Math.floor(t * 8)))
    g.globalAlpha = clamp(alpha * (form < 1 ? 0.3 + 0.55 * form : 0.8) * ((focus || route) && !hot ? 0.3 : 1) * (0.7 + 0.45 * a.mid + 0.5 * tw))
    g.fillStyle = '#e4e6ea'
    g.beginPath(); g.arc(x, y, (hot ? 4.6 : 3.0) + tw * 1.8 + (form < 0.05 ? hash(i, 9) * 1.2 : 0), 0, 7); g.fill()
  })
  // centros de grupo: aparecen de a uno, al golpe
  DATA.clusters.forEach((h, ci) => {
    const born = T_DROP + 2 * BAR + ci * BEAT * 0.5
    const kb = ease(span(t, born, born + 0.35))
    if (!kb || form < 1) return
    const [x, y] = hubs[ci], r = (6 + Math.sqrt(h.n) * 0.9) * kb * (1 + 0.42 * k)
    g.globalAlpha = alpha * ((focus || route) ? 0.35 : 1)
    g.fillStyle = BG; g.beginPath(); g.arc(x, y, r + 4, 0, 7); g.fill()
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill()
    g.font = font(17 / (cam ? Math.sqrt(cam.s) : 1)); g.textAlign = 'center'
    g.lineWidth = 5; g.strokeStyle = BG; g.strokeText(h.label, x, y + r + 24); g.fillStyle = SOFT; g.fillText(h.label, x, y + r + 24)
  })
  // tema elegido y sus vecinos, una línea por golpe
  if (focus) {
    const [fx, fy] = pos(DATA.focus)
    DATA.near.forEach((j, n) => {
      const kl = ease(span(focus, n * BEAT, n * BEAT + 0.3)); if (!kl) return
      const [x, y] = pos(j)
      g.globalAlpha = alpha * 0.85; g.strokeStyle = FG; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + (x - fx) * kl, fy + (y - fy) * kl); g.stroke()
    })
    g.globalAlpha = alpha; g.strokeStyle = FG; g.lineWidth = 1.6
    g.beginPath(); g.arc(fx, fy, 10 + 6 * (1 - ease(span(focus, 0, 0.4))), 0, 7); g.stroke()
  }
  // recorrido del set
  if (route) {
    const pts = DATA.route.map(pos), total = pts.length - 1, upto = route * total
    g.globalAlpha = alpha * 0.95; g.strokeStyle = SIGNAL; g.lineWidth = 2.4; g.lineJoin = 'round'
    g.beginPath()
    pts.forEach(([x, y], i) => {
      if (i === 0) return g.moveTo(x, y)
      if (i <= upto) g.lineTo(x, y)
      else if (i - 1 < upto) { const f = upto - (i - 1), [px, py] = pts[i - 1]; g.lineTo(px + (x - px) * f, py + (y - py) * f) }
    })
    g.stroke()
    g.fillStyle = SIGNAL; g.font = font(15, 500, true); g.textAlign = 'left'
    pts.forEach(([x, y], i) => { if (i <= upto) { g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill() } })
  }
  g.restore()
}

const keyHue = (k) => (((parseInt(k) || 1) - 1) * 30 + 200) % 360
function chip(x, y, text, color, bg) {
  g.font = font(17, 500, true); const w = g.measureText(text).width + 18
  g.fillStyle = bg; g.beginPath(); g.roundRect(x, y - 17, w, 24, 5); g.fill()
  g.fillStyle = color; g.textAlign = 'left'; g.fillText(text, x + 9, y + 1)
  return w
}
const RULE = (a, b) => {
  const p = (k) => ({ n: parseInt(k), l: k.slice(-1) }); const A = p(a), B = p(b)
  const d = Math.min((A.n - B.n + 12) % 12, (B.n - A.n + 12) % 12), s = A.l === B.l
  return s && d === 0 ? 'misma' : s && d === 1 ? '±1' : !s && d === 0 ? 'A↔B' : s && d === 2 ? '±2' : s && d === 5 ? '±5' : !s && d === 3 ? '±3 A↔B' : null
}
const CARD = 168, STEP = 252, X0 = 470, ROWS_Y = [250, 505, 760]
const ROW_NAMES = ['Warm-up', 'Build-up', 'Peak']
/** Momento en que entra la tarjeta c de la fila r. */
const cardAt = (r, c) => T_SETS + BEAT * (1 + r * 6 + c)
const T_CLASH = T_SETS + 5 * BAR, T_FIX = T_SETS + 6 * BAR

function drawSets(t, alpha) {
  g.save(); g.globalAlpha = alpha
  DATA.rows.forEach((row, r) => {
    const y = ROWS_Y[r]
    const kr = ease(span(t, cardAt(r, 0) - BEAT, cardAt(r, 0) - BEAT + 0.4))
    g.globalAlpha = alpha * kr
    g.fillStyle = r === 2 ? SIGNAL : FAINT; g.beginPath(); g.arc(196, y + 16, 5, 0, 7); g.fill()
    g.font = font(30); g.textAlign = 'left'; g.fillStyle = FG; g.fillText(ROW_NAMES[r], 216, y + 26)
    g.font = font(17, 400, true); g.fillStyle = FAINT; g.fillText(`${row.length} temas · ${[38, 36, 41][r]} min`, 216, y + 56)
    // la última fila llega con dos temas en un orden que choca; después se acomodan
    const swap = r === 2 ? inOut(span(t, T_FIX, T_FIX + 0.55)) : 1
    const order = row.map((_, i) => i)
    const xOf = (i) => {
      if (r !== 2 || i < 3) return X0 + i * STEP
      const from = i === 3 ? 4 : 3
      return X0 + (from + (i - from) * swap) * STEP
    }
    order.forEach((i) => {
      const tr = row[i], kc = ease(span(t, cardAt(r, i), cardAt(r, i) + 0.35)); if (!kc) return
      const shake = r === 2 && i >= 3 && t > T_CLASH && t < T_FIX ? Math.sin((t - T_CLASH) * 46) * 5 * Math.pow(1 - span(t, T_CLASH, T_CLASH + 0.5), 2) : 0
      const x = xOf(i) + shake, yy = y + (1 - kc) * 26
      g.globalAlpha = alpha * kc
      const hue = keyHue(tr.key), grad = g.createLinearGradient(x, yy, x + CARD, yy + CARD)
      grad.addColorStop(0, `oklch(0.3 0.03 ${hue})`); grad.addColorStop(1, `oklch(0.17 0.012 ${hue})`)
      g.fillStyle = grad; g.beginPath(); g.roundRect(x, yy, CARD, CARD, 6); g.fill()
      g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1; g.stroke()
      // vinilo esquemático como tapa
      g.strokeStyle = `oklch(0.75 0.06 ${hue} / 0.5)`; g.lineWidth = 1.2
      const beat = kick(t); for (const rr of [22, 40, 58]) { g.globalAlpha = alpha * kc * (0.55 + 0.45 * beat); g.beginPath(); g.arc(x + CARD / 2, yy + CARD / 2, rr * (1 + 0.07 * beat), 0, 7); g.stroke() }
      g.globalAlpha = alpha * kc
      g.font = font(18); g.fillStyle = FG; g.textAlign = 'left'
      const title = tr.title.length > 19 ? tr.title.slice(0, 18) + '…' : tr.title
      g.fillText(title, x, yy + CARD + 28)
      g.font = font(15, 400); g.fillStyle = FAINT; g.fillText(tr.artist.length > 22 ? tr.artist.slice(0, 21) + '…' : tr.artist, x, yy + CARD + 50)
      chip(x + CARD - 52, yy + 28, tr.key, `oklch(0.82 0.085 ${hue})`, `oklch(0.82 0.085 ${hue} / 0.2)`)
    })
    // uniones entre temas
    for (let i = 1; i < row.length; i++) {
      const born = cardAt(r, i) + 0.2, kl = ease(span(t, born, born + 0.3)); if (!kl) continue
      let a = row[i - 1], b = row[i]
      if (r === 2 && t < T_FIX + 0.3) { const before = [0, 1, 2, 4, 3]; a = row[before[i - 1]]; b = row[before[i]] }
      const rule = RULE(a.key, b.key), x = X0 + i * STEP - (STEP - CARD) / 2, yy = y + CARD / 2
      g.globalAlpha = alpha * kl
      g.strokeStyle = LINE; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - 26, yy + 16); g.lineTo(x + 26, yy + 16); g.stroke()
      g.font = font(17, 500, true); g.textAlign = 'center'
      if (rule) { g.fillStyle = SIGNAL; g.fillText(rule, x, yy + 2) }
      else {
        const p = 0.6 + 0.4 * Math.abs(Math.sin((t - born) * 7))
        g.globalAlpha = alpha * kl * p
        g.fillStyle = 'rgba(226,180,106,.16)'; g.beginPath(); g.roundRect(x - 38, yy - 18, 76, 28, 5); g.fill()
        g.fillStyle = WARN; g.fillText('choca', x, yy + 2)
      }
    }
  })
  g.restore()
}

function logo(t, a) {
  const k = ease(span(t, a, a + 0.8)); if (!k) return
  g.save(); g.globalAlpha = k
  const cx = W / 2, cy = H / 2 - 70
  g.strokeStyle = FG; g.lineWidth = 2
  for (let i = 0; i < 48; i++) { const an = (i / 48) * 6.283 + t * 0.15; g.globalAlpha = k * 0.55; g.fillStyle = FG; g.beginPath(); g.arc(cx + Math.cos(an) * 92, cy + Math.sin(an) * 92, 2.6, 0, 7); g.fill() }
  ring(t, cx, cy, 108, k * 0.7, 60)
  g.globalAlpha = k; g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, 15 * (1 + 0.45 * kick(t)), 0, 7); g.fill()
  for (let i = 0; i < 5; i++) { const an = (i / 5) * 6.283 - t * 0.2; g.beginPath(); g.arc(cx + Math.cos(an) * 46, cy + Math.sin(an) * 46, 6, 0, 7); g.fill() }
  g.font = font(92, 500); g.textAlign = 'center'; g.fillStyle = FG; g.fillText('Serendipia', cx, cy + 210 + (1 - k) * 16)
  const k2 = ease(span(t, a + 0.9, a + 1.6)); g.globalAlpha = k2
  g.font = font(30, 400); g.fillStyle = SOFT; g.fillText('No sabés lo que vas a encontrar. Eso es lo mejor.', cx, cy + 270)
  g.restore()
}

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = BG; g.fillRect(0, 0, W, H)
  if (t < T_DROP) {
    // el problema: todo suelto, y la presión de elegir
    const tension = span(t, 6 * BAR, T_DROP)
    g.save(); g.translate(W / 2, H / 2); g.scale(1 - 0.06 * inOut(tension), 1 - 0.06 * inOut(tension)); g.translate(-W / 2, -H / 2)
    drawGalaxy(t, { form: 0, alpha: 0.55 + 0.3 * tension })
    g.restore()
    bars(t, W / 2 - 300, H - 90, 600, 54, 0.5)
    caption(t, 0.4, 2 * BAR, `${N} temas.`, { px: 104 })
    caption(t, 2 * BAR, 4 * BAR, 'Una pista esperando.', { px: 84 })
    caption(t, 4 * BAR, 6 * BAR, '60 segundos para elegir el próximo.', { px: 72 })
    caption(t, 6 * BAR, T_DROP - 0.05, '¿Cuál sigue?', { px: 120 })
  } else if (t < T_SETS) {
    const u = t - T_DROP
    const zoomIn = inOut(span(t, T_DROP + 4.5 * BAR, T_DROP + 5.5 * BAR)), zoomOut = inOut(span(t, T_SETS - 0.9 * BAR, T_SETS))
    const z = zoomIn * (1 - zoomOut), f = gal[DATA.focus]
    const cam = { s: 1 + 1.5 * z, x: W / 2 + (f[0] - W / 2) * z, y: H / 2 + (f[1] - H / 2) * z }
    const focusT = Math.max(0, t - (T_DROP + 5.5 * BAR))
    // el golpe empuja la cámara apenas hacia adentro
    cam.s *= 1 + 0.018 * kick(t)
    ring(t, W / 2, H / 2, 486, span(u, 0.8 * BAR, 2 * BAR) * (1 - z) * 0.55)
    drawGalaxy(t, { form: span(u, 0, 1.6 * BAR), cam, focus: focusT > 0 && zoomOut < 0.5 ? focusT : 0 })
    caption(t, T_DROP + 0.5 * BAR, T_DROP + 2.5 * BAR, 'Serendipia escucha tu música', { y: 980, px: 46, x: 120, align: 'left' })
    caption(t, T_DROP + 2.5 * BAR, T_DROP + 4.6 * BAR, 'y la ordena por cómo suena.', { y: 980, px: 46, x: 120, align: 'left' })
    caption(t, T_DROP + 5.5 * BAR, T_SETS - 0.2, 'Los parecidos, cerca.', { y: 980, px: 46, x: 120, align: 'left' })
  } else if (t < T_ROUTE) {
    const fadeIn = span(t, T_SETS, T_SETS + 0.5), fadeOut = span(t, T_ROUTE - 0.5, T_ROUTE)
    drawGalaxy(t, { alpha: 0.1 * (1 - fadeIn) + 0.07 })
    g.fillStyle = 'rgba(13,14,16,.55)'; g.fillRect(0, 0, W, H)
    drawSets(t, fadeIn * (1 - fadeOut))
    bars(t, W - 196 - 360, 150, 360, 46, 0.55 * fadeIn * (1 - fadeOut))
    caption(t, T_SETS + 0.3, T_SETS + 4.6 * BAR, 'Armá el set por capítulos.', { y: 140, px: 50, x: 196, align: 'left' })
    caption(t, T_CLASH, T_FIX, 'Esta mezcla choca.', { y: 140, px: 50, x: 196, align: 'left', color: WARN })
    caption(t, T_FIX, T_ROUTE - 0.1, 'Movés un tema. Listo.', { y: 140, px: 50, x: 196, align: 'left' })
  } else {
    const u = t - T_ROUTE, out = span(t, T_ROUTE + 2 * BAR, T_ROUTE + 2.4 * BAR)
    ring(t, W / 2, H / 2, 486, 0.5 * (1 - out))
    drawGalaxy(t, { alpha: (0.3 + 0.7 * span(u, 0, 0.5)) * (1 - out), route: ease(span(u, 0.2, 1.7 * BAR)) })
    caption(t, T_ROUTE + 0.3, T_ROUTE + 2 * BAR, 'Tu set, de un vistazo.', { y: 980, px: 46, x: 120, align: 'left' })
    caption(t, T_ROUTE + 3 * BAR, T_END, DATA.song, { y: H - 70, px: 20, color: FAINT, weight: 400 })
    logo(t, T_ROUTE + 2.3 * BAR)
    const end = span(t, T_END - 0.6, T_END); if (end) { g.fillStyle = BG; g.globalAlpha = end; g.fillRect(0, 0, W, H) }
  }
}

/** Momentos con sonido de interfaz, para la mezcla de audio. */
window.events = () => {
  const ev = []
  DATA.clusters.forEach((_, ci) => ci % 2 === 0 && ev.push({ t: T_DROP + 2 * BAR + ci * BEAT * 0.5, s: 'pop' }))
  ev.push({ t: T_DROP + 5.5 * BAR, s: 'click' })
  DATA.near.forEach((_, n) => ev.push({ t: T_DROP + 5.5 * BAR + n * BEAT, s: 'tick' }))
  DATA.rows.forEach((row, r) => row.forEach((_, i) => ev.push({ t: cardAt(r, i), s: 'click' })))
  ev.push({ t: T_CLASH, s: 'warn' }, { t: T_FIX, s: 'pop' }, { t: T_FIX + 0.5, s: 'click' })
  return { events: ev, duration: T_END }
}
</script>
